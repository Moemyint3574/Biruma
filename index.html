<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biruma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css/destyle.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <h1 class="header__logo">
                <a href="#"><img src="./images/logo.svg" alt=""></a>
            </h1>
            <nav class="gnav">
                <ul class="gnav__list">
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">MENU</a></li>
                    <li><a href="#">NEWS</a></li>
                    <li><a href="#">INFORMATION</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero__inner">
                <div class="hero__image image">
                    <div class="image__animation">
                        <img src="./images/hero1.JPG" alt="ミャンマー料理">
                        <img src="./images/hero2.JPG" alt="" aria-hidden="true">
                        <img src="./images/hero3.JPG" alt="" aria-hidden="true">
                        <img src="./images/hero4.JPG" alt="" aria-hidden="true">
                    </div>
                </div>
                <div class="hero__content">
                    <h2 class="hero__heading">
                        名古屋で出会う、<wbr>
                        ミャンマーの本場の味。
                    </h2>
                    <p class="hero__text">ビルマ居酒屋</p>
                </div>
            </div>
        </section>
        <section class="introduction">
            <div class="introduction__inner">
                <div class="introduction__intro intro">
                    <div class="intro__part">
                        <h2 class="intro__title">こだわり</h2>
                        <h3 class="intro__heading">ミャンマーの味をそのままに</h3>
                        <p class="intro__content u-keepall">ビルマ居酒屋では、<wbr>ミャンマー本来の味や<wbr>伝統的な食文化を<wbr>大切にしています。
                    辛い料理が苦手な方や、<wbr>日本人のお客様にも<wbr>安心してお楽しみいただけるよう、<wbr>辛さの調整も可能です。
                    お好みに合わせて<wbr>辛さをお選びいただけますので、<wbr>ぜひお気軽にお申し付けください。</p>
                    </div>
                    <div class="intro__image">
                        <img src="./images/introimage.webp" alt="">
                    </div>
                </div>
                <div class="introduction__list">
                    <article class="introduction__item card">
                        <img class="card__img" src="./images/intro1.png" alt="">
                        <dl class="card__body">
                            <dt class=" card__title">
                                本場の味
                            </dt>
                            <dd class="card__text">ミャンマー伝統
                                の味を大切にし
                                た料理</dd>
                        </dl>
                    </article>
                    <article class="introduction__item card">
                        <img class="card__img" src="./images/intro1.png" alt="">
                        <dl class="card__body">
                            <dt class=" card__title">
                                辛さの調整
                            </dt>
                            <dd class="card__text">お好みにあわせて
                                辛さを調整でき
                                ます。</dd>
                        </dl>
                    </article>
                    <article class="introduction__item card">
                        <img class="card__img" src="./images/intro3.png" alt="">
                        <dl class="card__body">
                            <dt class=" card__title">
                                安心できる空間
                            </dt>
                            <dd class="card__text">ミャンマー伝統
                                の味を大切にし
                                た料理</dd>
                        </dl>
                    </article>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
